[project]
name = "livesub"
version = "0.1.0"
description = "Offline live captions for anything your computer plays or hears, with optional translation: faster-whisper, a caption overlay, SRT/VTT export."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["captions", "subtitles", "speech-to-text", "whisper", "faster-whisper", "translation", "accessibility", "offline"]

[project.urls]
Homepage = "https://github.com/zch6a/livesub"
Issues = "https://github.com/zch6a/livesub/issues"

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
capture = ["soundcard>=0.4"]
all = ["faster-whisper>=1.0", "soundcard>=0.4"]

[project.scripts]
livesub = "livesub.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livesub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/mutate.py" = ["E501"]  # the mutant table: one line per mutant reads best
"tests/test_streaming.py" = ["E501"]  # recorded Whisper readings, one per line

[tool.ruff.lint.isort]
known-first-party = ["livesub", "synth", "test_translate"]
